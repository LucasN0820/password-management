appId: com.lucasni.password-desktop
productName: Password Vault
copyright: Copyright © 2024 Lucas

directories:
  buildResources: build
  output: release

files:
  - dist/**/*
  - dist-electron/**/*

extraResources:
  - from: public/icon-512.png
    to: icon-512.png
  - from: bin/llama.cpp
    to: llama.cpp
  - from: build/desktop-env.json
    to: desktop-env.json

# Rebuild better-sqlite3 for the target Electron version
nodeGypRebuild: false
npmRebuild: true

asar: true
asarUnpack:
  - '**/*.node'

mac:
  category: public.app-category.utilities
  icon: build/icon.icns
  # No spaces in artifact names: GitHub rewrites spaces in release asset
  # names, which would break electron-updater's generic feed resolution.
  artifactName: 'Password-Vault-${version}-mac-${arch}.${ext}'
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  artifactName: 'Password-Vault-${version}-mac-${arch}.dmg'
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  icon: build/icon.ico
  artifactName: 'Password-Vault-${version}-win-${arch}.${ext}'
  target:
    - target: nsis
      arch:
        - x64
        - arm64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: 'Password-Vault-${version}-win-${arch}-setup.exe'

linux:
  icon: build/icons
  category: Utility
  artifactName: 'Password-Vault-${version}-linux-${arch}.${ext}'
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64

appImage:
  artifactName: 'Password-Vault-${version}-linux-${arch}.AppImage'

publish:
  provider: github
  owner: LucasN0820
  repo: password-management
  releaseType: release
