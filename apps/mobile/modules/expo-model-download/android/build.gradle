plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.modeldownload'
version = '0.1.0'

android {
  namespace "expo.modules.modeldownload"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
}
