<!-- @dsCard group="Components" viewport="700x520" name="Display — Card · Badge · Avatar · StrengthMeter · PasswordRow" subtitle="Surfaces, pills, icon tiles, the strength bar and a live password row" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--paper-2); padding: 26px 30px; color: var(--text-primary); }
  .lbl { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-tertiary); margin: 0 0 10px; }
  .sec { margin-bottom: 22px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
  .listbox { background: var(--surface-card); border: 1px solid var(--border-color); border-radius: var(--radius-xl); padding: 8px; }
  h3 { font-family: var(--font-display); font-weight: 500; font-size: 18px; margin: 0 0 6px; }
  .muted { color: var(--text-secondary); font-size: 14px; line-height: 1.6; margin: 0; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Card, Badge, Avatar, StrengthMeter, PasswordRow } = window.VaultDesignSystem_ad3078;

    function Demo() {
      const [sel, setSel] = React.useState(1);
      const [fav, setFav] = React.useState({1:true});
      const rows = [
        { id:1, title:'Google', username:'hello@example.com', letter:'G', tone:'#E8F0FE', timeAgo:'2h' },
        { id:2, title:'Netflix', username:'hello@example.com', letter:'N', tone:'#FDE8E7', timeAgo:'1d' },
        { id:3, title:'Figma', username:'design@studio.co', letter:'F', tone:'#EAE6FF', timeAgo:'3d' },
      ];
      return (
        <div>
          <div className="sec">
            <p className="lbl">Badges</p>
            <div className="row">
              <Badge>最受欢迎</Badge>
              <Badge tone="neutral">Free</Badge>
              <Badge tone="success">Strong</Badge>
              <Badge tone="warning">Reused</Badge>
              <Badge tone="danger">Weak</Badge>
              <Badge tone="mono">AES-256-GCM</Badge>
              <Badge tone="mono">PBKDF2</Badge>
            </div>
          </div>

          <div className="sec">
            <p className="lbl">Avatars — services &amp; people</p>
            <div className="row">
              <Avatar letter="G" tone="#E8F0FE" />
              <Avatar letter="N" tone="#FDE8E7" />
              <Avatar letter="F" tone="#EAE6FF" />
              <Avatar letter="L" shape="round" size={36} tone="var(--paper-5)" />
            </div>
          </div>

          <div className="grid2">
            <div className="sec">
              <p className="lbl">PasswordRow — click to select</p>
              <div className="listbox">
                {rows.map(r => (
                  <PasswordRow key={r.id} {...r}
                    selected={sel===r.id}
                    favorite={!!fav[r.id]}
                    onClick={() => setSel(r.id)}
                    onToggleFavorite={() => setFav(f => ({...f, [r.id]: !f[r.id]}))}
                  />
                ))}
              </div>
            </div>

            <div className="sec">
              <p className="lbl">Card + StrengthMeter</p>
              <Card hoverable style={{padding:20}}>
                <h3>零知识加密</h3>
                <p className="muted">Encrypted before it leaves your device.</p>
                <div style={{marginTop:14}}><StrengthMeter value={86} /></div>
              </Card>
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
