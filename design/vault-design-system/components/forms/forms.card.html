<!-- @dsCard group="Components" viewport="700x430" name="Forms — Button · Input · Switch · Slider" subtitle="Interactive primitives: ink buttons, warm fields, toggles, length slider" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--paper-2); padding: 26px 30px; color: var(--text-primary); }
  .sec { margin-bottom: 22px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-tertiary); margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .panel { background: var(--surface-card); border: 1px solid var(--border-color); border-radius: var(--radius-xl); padding: 16px 18px; max-width: 340px; }
  .opt { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; }
  .opt span { font-size: 14px; }
  .len { display:flex; justify-content: space-between; align-items:center; margin-bottom: 8px; }
  .len b { font-family: var(--font-mono); color: var(--clay); font-weight: 500; }
  .cols { display:flex; gap: 28px; flex-wrap: wrap; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Button, Input, Switch, Slider } = window.VaultDesignSystem_ad3078;

    function Demo() {
      const [on, setOn] = React.useState({ upper: true, lower: true, num: true, sym: false });
      const [len, setLen] = React.useState(16);
      const toggle = (k) => setOn(s => ({ ...s, [k]: !s[k] }));
      return (
        <div>
          <div className="sec">
            <div className="lbl">Buttons — variants &amp; sizes</div>
            <div className="row">
              <Button>免费开始</Button>
              <Button variant="secondary">Secondary</Button>
              <Button variant="outline">Outline</Button>
              <Button variant="ghost">Ghost</Button>
              <Button variant="destructive">Delete</Button>
              <Button variant="link">了解更多</Button>
            </div>
            <div className="row" style={{marginTop:10}}>
              <Button size="sm">Small</Button>
              <Button size="default">Default</Button>
              <Button size="lg">Large</Button>
              <Button disabled>Disabled</Button>
            </div>
          </div>

          <div className="cols">
            <div className="sec" style={{flex:1, minWidth:240}}>
              <div className="lbl">Input</div>
              <div className="row" style={{flexDirection:'column', alignItems:'stretch', gap:10}}>
                <Input placeholder="搜索密码..." />
                <Input mono defaultValue="k7$Rm9!qXz2vBn4w" />
              </div>
            </div>

            <div className="sec">
              <div className="lbl">Switch + Slider — generator options</div>
              <div className="panel">
                <div className="len"><span style={{fontSize:14, fontWeight:600}}>Length</span><b>{len}</b></div>
                <Slider value={len} min={4} max={64} onValueChange={setLen} />
                <div style={{height:12}} />
                <div className="opt"><span>Uppercase A–Z</span><Switch checked={on.upper} onCheckedChange={() => toggle('upper')} /></div>
                <div className="opt"><span>Numbers 0–9</span><Switch checked={on.num} onCheckedChange={() => toggle('num')} /></div>
                <div className="opt"><span>Symbols !@#</span><Switch checked={on.sym} onCheckedChange={() => toggle('sym')} /></div>
              </div>
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
