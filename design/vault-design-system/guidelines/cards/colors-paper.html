<!-- @dsCard group="Colors" viewport="700x180" name="Paper — ivory surfaces" subtitle="Warm ivory ramp from white card to deep selected-row fill" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--paper-2); padding: 24px; }
  .row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; }
  .sw { border-radius: var(--radius-md); border: 1px solid var(--border-color); overflow: hidden; }
  .chip { height: 64px; }
  .meta { padding: 8px 9px 9px; }
  .name { font-size: 11px; font-weight: 600; color: var(--text-primary); }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--paper-0)"></div><div class="meta"><div class="name">paper-0</div><div class="hex">#ffffff</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--paper-1)"></div><div class="meta"><div class="name">paper-1</div><div class="hex">#faf9f7</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--paper-2)"></div><div class="meta"><div class="name">paper-2</div><div class="hex">#f8f7f2</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--paper-3)"></div><div class="meta"><div class="name">paper-3</div><div class="hex">#f4f1ec</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--paper-4)"></div><div class="meta"><div class="name">paper-4</div><div class="hex">#f2efe7</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--paper-5)"></div><div class="meta"><div class="name">paper-5</div><div class="hex">#ede9e0</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--paper-6)"></div><div class="meta"><div class="name">paper-6</div><div class="hex">#eee9dd</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--paper-7)"></div><div class="meta"><div class="name">paper-7</div><div class="hex">#efe5d7</div></div></div>
  </div>
</body>
</html>
