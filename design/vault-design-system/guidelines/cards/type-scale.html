<!-- @dsCard group="Type" viewport="700x200" name="Type scale" subtitle="Shared px ramp — app sections through marketing hero" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--paper-0); padding: 22px 30px; color: var(--text-primary); }
  .line { display: flex; align-items: baseline; gap: 16px; padding: 3px 0; border-bottom: 1px solid var(--paper-5); }
  .line:last-child { border-bottom: none; }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); width: 110px; flex: none; }
  .sample { font-family: var(--font-display); font-weight: 500; color: var(--text-strong); white-space: nowrap; }
</style>
</head>
<body>
  <div class="line"><span class="tok">6xl · 72</span><span class="sample" style="font-size:40px">Vault</span></div>
  <div class="line"><span class="tok">4xl · 46</span><span class="sample" style="font-size:32px">Vault</span></div>
  <div class="line"><span class="tok">2xl · 30</span><span class="sample" style="font-size:24px">Vault</span></div>
  <div class="line"><span class="tok">xl · 24</span><span class="sample" style="font-size:20px">Vault</span></div>
  <div class="line"><span class="tok">lg · 20</span><span class="sample" style="font-size:17px">Vault</span></div>
  <div class="line"><span class="tok">base · 15</span><span class="sample" style="font-size:15px">Vault</span></div>
  <div class="line"><span class="tok">sm · 13 &nbsp; xs · 12</span><span class="sample" style="font-size:13px">Vault</span></div>
</body>
</html>
