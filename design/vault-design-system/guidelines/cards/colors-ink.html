<!-- @dsCard group="Colors" viewport="700x180" name="Ink — text ramp" subtitle="Warm near-black to muted clay-grey for type and icons" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--paper-1); padding: 24px; }
  .row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; }
  .sw { border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-color); background: var(--paper-0); }
  .chip { height: 64px; }
  .meta { padding: 8px 9px 9px; }
  .name { font-size: 11px; font-weight: 600; color: var(--text-primary); }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--ink-0)"></div><div class="meta"><div class="name">ink-0</div><div class="hex">#171614</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-1)"></div><div class="meta"><div class="name">ink-1</div><div class="hex">#1a1916</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-2)"></div><div class="meta"><div class="name">ink-2</div><div class="hex">#1f1e1b</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-3)"></div><div class="meta"><div class="name">ink-3</div><div class="hex">#3a3834</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-4)"></div><div class="meta"><div class="name">ink-4</div><div class="hex">#44423d</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-5)"></div><div class="meta"><div class="name">ink-5</div><div class="hex">#6b6860</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-6)"></div><div class="meta"><div class="name">ink-6</div><div class="hex">#78736b</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-7)"></div><div class="meta"><div class="name">ink-7</div><div class="hex">#b6b0a5</div></div></div>
  </div>
</body>
</html>
