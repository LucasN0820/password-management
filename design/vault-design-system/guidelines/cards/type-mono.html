<!-- @dsCard group="Type" viewport="700x190" name="Mono — JetBrains Mono" subtitle="Passwords are ALWAYS monospace. Also keycaps, tags, metadata." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--paper-1); padding: 26px 32px; color: var(--text-primary); }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); display:block; margin-bottom: 6px; }
  .pw { font-family: var(--font-mono); font-size: 24px; font-weight: 500; letter-spacing: 0.04em; color: var(--text-strong); }
  .row { display:flex; align-items:center; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  kbd { font-family: var(--font-mono); font-size: 11px; color: var(--text-primary); border: 1px solid var(--border-color); background: var(--paper-4); border-radius: var(--radius-sm); padding: 3px 8px; }
  .tag { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); border: 1px solid var(--border-color); background: var(--paper-0); border-radius: var(--radius-sm); padding: 4px 10px; }
</style>
</head>
<body>
  <span class="lbl">password · 24 / 500 / tracked</span>
  <div class="pw">k7$Rm9!qXz2vBn4w</div>
  <div class="row">
    <kbd>Ctrl+Shift+P</kbd><kbd>⌘⇧P</kbd><kbd>Esc</kbd><kbd>↑ / ↓</kbd>
    <span class="tag">AES-256-GCM</span><span class="tag">PBKDF2</span><span class="tag">本地加密</span>
  </div>
</body>
</html>
