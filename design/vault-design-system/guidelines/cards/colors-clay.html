<!-- @dsCard group="Colors" viewport="700x210" name="Clay — the accent" subtitle="One terracotta accent carries the whole brand. No blues, no purple." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--paper-1); padding: 24px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
  .sw { border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-color); background: var(--paper-0); }
  .chip { height: 56px; display:flex; align-items:flex-end; padding: 8px; }
  .meta { padding: 7px 9px 8px; }
  .name { font-size: 11px; font-weight: 600; color: var(--text-primary); }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); margin-top: 2px; }
  .tints { display:flex; gap: 10px; }
  .tint { flex:1; border:1px solid var(--border-color); border-radius: var(--radius-md); padding: 10px 12px; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-secondary); }
  .dot { width:18px; height:18px; border-radius:var(--radius-full); flex:none; }
  code { font-family: var(--font-mono); font-size: 11px; color: var(--clay-mid); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--clay)"></div><div class="meta"><div class="name">clay · accent</div><div class="hex">#d97757</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--clay-brand)"></div><div class="meta"><div class="name">clay-brand</div><div class="hex">#c96442</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--clay-mid)"></div><div class="meta"><div class="name">clay-mid</div><div class="hex">#c26b4a</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--clay-dark)"></div><div class="meta"><div class="name">clay-dark · press</div><div class="hex">#b45d44</div></div></div>
  </div>
  <div class="tints">
    <div class="tint"><span class="dot" style="background:var(--clay-soft); border:1px solid var(--clay-haze)"></span> <span><code>--clay-soft</code> · icon fill</span></div>
    <div class="tint"><span class="dot" style="background:var(--clay-tint); border:1px solid var(--clay-haze)"></span> <span><code>--clay-tint</code> · badges</span></div>
    <div class="tint"><span class="dot" style="background:var(--clay-haze)"></span> <span><code>--clay-haze</code> · on dark</span></div>
  </div>
</body>
</html>
