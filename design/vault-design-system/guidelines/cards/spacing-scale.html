<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base unit — the rhythm behind every gap and pad" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--paper-0); padding: 24px; }
  .row { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
  .item { text-align: center; }
  .bar { background: var(--clay); border-radius: 2px; width: 100%; }
  .cell { width: 38px; }
  .name { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); margin-top: 6px; }
</style>
</head>
<body>
  <div class="row">
    <div class="item cell"><div class="bar" style="height:4px"></div><div class="name">1·4</div></div>
    <div class="item cell"><div class="bar" style="height:8px"></div><div class="name">2·8</div></div>
    <div class="item cell"><div class="bar" style="height:12px"></div><div class="name">3·12</div></div>
    <div class="item cell"><div class="bar" style="height:16px"></div><div class="name">4·16</div></div>
    <div class="item cell"><div class="bar" style="height:24px"></div><div class="name">6·24</div></div>
    <div class="item cell"><div class="bar" style="height:32px"></div><div class="name">8·32</div></div>
    <div class="item cell"><div class="bar" style="height:48px"></div><div class="name">12·48</div></div>
    <div class="item cell"><div class="bar" style="height:64px"></div><div class="name">16·64</div></div>
    <div class="item cell"><div class="bar" style="height:80px"></div><div class="name">20·80</div></div>
  </div>
</body>
</html>
