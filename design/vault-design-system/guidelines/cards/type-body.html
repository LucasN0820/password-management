<!-- @dsCard group="Type" viewport="700x230" name="Body — Noto Sans SC" subtitle="UI labels and reading copy. Calm, legible, never shouty." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--paper-0); padding: 28px 32px; color: var(--text-primary); }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); display:block; margin-bottom: 4px; }
  .stack > div { margin-bottom: 16px; }
  .eyebrow { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--text-accent); }
  .lead { font-size: 17px; line-height: 1.7; color: var(--text-secondary); max-width: 560px; }
  .body { font-size: 15px; line-height: 1.65; color: var(--text-primary); max-width: 560px; }
  .small { font-size: 13px; color: var(--text-secondary); }
</style>
</head>
<body>
  <div class="stack">
    <div><span class="lbl">eyebrow · 12 / 600 / uppercase / clay</span><div class="eyebrow">安全架构 · Security</div></div>
    <div><span class="lbl">lead · 17 / 1.7</span><div class="lead">Vault keeps your digital identity with restraint — nothing to memorise, nothing to compromise.</div></div>
    <div><span class="lbl">body · 15 / 1.65 &nbsp;·&nbsp; small · 13</span><div class="body">Your master key never leaves your device. <span class="small">免费版永久可用 · 无需信用卡</span></div></div>
  </div>
</body>
</html>
