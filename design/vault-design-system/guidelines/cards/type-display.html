<!-- @dsCard group="Type" viewport="700x240" name="Display — Noto Serif SC" subtitle="Headings & page titles. Medium weight, tight tracking." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--paper-1); padding: 28px 32px; color: var(--text-primary); }
  .display { font-family: var(--font-display); font-weight: 500; letter-spacing: var(--tracking-tight); line-height: 1.1; color: var(--text-strong); }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); display:block; margin-bottom: 2px; }
  .stack > div { margin-bottom: 14px; }
  em { font-style: italic; color: var(--ink-3); }
</style>
</head>
<body>
  <div class="stack">
    <div><span class="lbl">6xl · 72 / hero</span><div class="display" style="font-size:56px">记住一个密码</div></div>
    <div><span class="lbl">4xl · 46 / page title</span><div class="display" style="font-size:40px">Generate a strong password</div></div>
    <div><span class="lbl">xl · 24 / section · weight 500</span><div class="display" style="font-size:24px">Recent passwords <em>— 少，但更好</em></div></div>
  </div>
</body>
</html>
